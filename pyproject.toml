[project]
name = "tuckerinc82"
version = "0.2.0"
description = "Standalone cross-project integration and authoritative real-world data fabric"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.3",
    "pydantic>=2.12"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "ruff>=0.12"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
