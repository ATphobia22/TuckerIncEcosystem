[project]
name = "tuckerinc82"
version = "0.3.0"
description = "Tucker AI: hybrid quantum-classical AI, governed experimentation, and authoritative data fabric"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.3",
    "numpy>=2.2",
    "pydantic>=2.12"
]

[project.optional-dependencies]
qml = [
    "pennylane>=0.43",
    "qiskit>=2.2",
    "qiskit-machine-learning>=0.9",
    "torch>=2.7",
    "torchquantum>=0.1.8",
    "cudaq>=0.15",
    "cirq>=1.6",
    "mitiq>=0.45",
    "amazon-braket-sdk>=1.99",
    "merlinquantum>=0.4"
]
tensorflow-quantum = [
    "tensorflow>=2.19,<2.20",
    "tensorflow-quantum>=0.7"
]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "ruff>=0.12"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
